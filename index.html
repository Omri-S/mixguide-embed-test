<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FaderCut embed test</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 16px; background: #0c0c0c; color: #e5e5e5; font: 14px system-ui, sans-serif; }
  form { display: flex; gap: 8px; margin-bottom: 12px; }
  input { flex: 1; max-width: 320px; padding: 8px; background: #161616; color: inherit; border: 1px solid #333; border-radius: 6px; }
  button { padding: 8px 14px; background: #e5e5e5; color: #0c0c0c; border: 0; border-radius: 6px; cursor: pointer; }
  #wrap { width: 100%; max-width: 960px; aspect-ratio: 16 / 9; background: #000; }
  #wrap > * { width: 100%; height: 100%; }
  pre { font: 12px ui-monospace, monospace; color: #a0a0a0; white-space: pre-wrap; }
</style>
</head>
<body>
<!-- Test page: does the official YouTube IFrame player play a given video when embedded from this site?
     No tracking, no cookies set by this page, no other code. ?v=<id>&autoplay=1 starts it muted. -->
<form id="f"><input id="v" placeholder="YouTube video id" aria-label="YouTube video id"><button>Load</button></form>
<div id="wrap"><div id="player"></div></div>
<pre id="log"></pre>
<script>
  const q = new URLSearchParams(location.search)
  const out = document.getElementById('log')
  // Result for automated checks: window.embedTest, and a postMessage to the parent when framed.
  window.embedTest = { id: null, states: [], error: null, played: false, done: false }
  const STATES = { '-1': 'unstarted', 0: 'ended', 1: 'playing', 2: 'paused', 3: 'buffering', 5: 'cued' }
  function log(s) {
    out.textContent += new Date().toISOString().slice(11, 23) + '  ' + s + '\n'
    if (parent !== window) parent.postMessage({ embedTest: window.embedTest }, '*')
  }
  let player = null
  function load(id) {
    window.embedTest = { id, states: [], error: null, played: false, done: false }
    out.textContent = ''
    log('load ' + id + ' from ' + location.origin)
    if (player) { player.loadVideoById(id); return }
    player = new YT.Player('player', {
      videoId: id,
      playerVars: { playsinline: 1, rel: 0, autoplay: q.get('autoplay') ? 1 : 0, mute: q.get('autoplay') ? 1 : 0 },
      events: {
        onReady: () => { log('ready'); if (q.get('autoplay')) { player.mute(); player.playVideo() } },
        onStateChange: (e) => {
          embedTest.states.push(e.data)
          if (e.data === 1) { embedTest.played = true; embedTest.done = true }
          log('state ' + e.data + ' ' + (STATES[e.data] || ''))
        },
        onError: (e) => { embedTest.error = e.data; embedTest.done = true; log('error ' + e.data) },
      },
    })
  }
  window.onYouTubeIframeAPIReady = () => { const id = q.get('v'); if (id) { document.getElementById('v').value = id; load(id) } }
  document.getElementById('f').onsubmit = (e) => { e.preventDefault(); const id = document.getElementById('v').value.trim(); if (id) load(id) }
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
