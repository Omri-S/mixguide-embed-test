<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>player</title>
<style>html, body { margin: 0; height: 100%; background: #000; } #player { width: 100%; height: 100%; }</style>
</head>
<body>
<!-- The official YouTube IFrame player on a public https page, for an app that frames this page.
     ?v=<video id>. No tracking, no cookies of ours, no other code.

     Messages to the framing window (window.parent), all {mg: <kind>, ...}:
       ready  {duration, rates}        state {state}  (YouTube codes: -1 unstarted, 0 ended, 1 playing, 2 paused, 3 buffering, 5 cued)
       rate   {rate}                   error {code}
       pos    {pos, at}  every 20 ms when the position changed; at = performance.timeOrigin + performance.now()
                         when it was read (comparable across frames on one machine)
     Commands from the framing window only: {mg: 'cmd', cmd: 'play' | 'pause' | 'seek' | 'rate' | 'mute' | 'unmute', arg} -->
<div id="player"></div>
<script>
  const v = new URLSearchParams(location.search).get('v')
  const send = (m) => { if (parent !== window) parent.postMessage(Object.assign({ mg: m.mg }, m), '*') }
  const stamp = () => performance.timeOrigin + performance.now()
  let p = null, last = null
  window.onYouTubeIframeAPIReady = () => {
    p = new YT.Player('player', {
      width: '100%', height: '100%', videoId: v,
      playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: () => {
          send({ mg: 'ready', duration: p.getDuration(), rates: p.getAvailablePlaybackRates() })
          setInterval(() => {
            const pos = p.getCurrentTime()
            if (pos !== last) { last = pos; send({ mg: 'pos', pos, at: stamp() }) }
          }, 20)
        },
        onStateChange: (e) => send({ mg: 'state', state: e.data, duration: p.getDuration() }),
        onPlaybackRateChange: (e) => send({ mg: 'rate', rate: e.data }),
        onError: (e) => send({ mg: 'error', code: e.data }),
      },
    })
  }
  addEventListener('message', (e) => {
    if (e.source !== parent || !p || !e.data || e.data.mg !== 'cmd') return
    const { cmd, arg } = e.data
    if (cmd === 'play') p.playVideo()
    else if (cmd === 'pause') p.pauseVideo()
    else if (cmd === 'seek') p.seekTo(Number(arg), true)
    else if (cmd === 'rate') p.setPlaybackRate(Number(arg))
    else if (cmd === 'mute') p.mute()
    else if (cmd === 'unmute') p.unMute()
  })
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
